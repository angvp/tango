name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # Relative links and #anchors only; --offline skips external URLs.
      - name: Markdown links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress './**/*.md'

  # cache/redis and cache/memcache are their own Go modules (ADR 0056), so the
  # test job's ./... skips them. Each runs the cachetest conformance suite
  # against the pinned server versions it claims to support.
  cache-adapters:
    name: cache adapters
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: go test cache/redis (Redis)
        working-directory: cache/redis
        env:
          TANGO_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: go test cache/redis (Valkey)
        working-directory: cache/redis
        env:
          TANGO_TEST_REDIS_URL: redis://localhost:6380/0
        run: go test -count=1 ./...
      - name: go test cache/memcache
        working-directory: cache/memcache
        env:
          TANGO_TEST_MEMCACHE_ADDR: localhost:11211
        run: |
          go vet ./...
          go test -count=1 ./...

  test:
    name: test (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # An empty TANGO_TEST_DSN selects SQLite, in-memory.
          - dialect: sqlite
            postgres-image: ""
            dsn: ""
          - dialect: postgres
            postgres-image: postgres:17-alpine
            dsn: postgres://tango:tango@localhost:5432/tango_test?sslmode=disable
    # An empty image skips the service, so only the postgres leg starts it.
    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_USER: tango
          POSTGRES_PASSWORD: tango
          POSTGRES_DB: tango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tango -d tango_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TANGO_TEST_DSN: ${{ matrix.dsn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: go test
        run: |
          go run gotest.tools/gotestsum@v1.13.0 \
            --junitfile "junit-${{ matrix.dialect }}.xml" \
            --format testname \
            -- ./... -count=1 -coverprofile="coverage-${{ matrix.dialect }}.out" -covermode=atomic
      # storage/s3 is its own Go module, so ./... above skips it (ADR 0054).
      - name: go test storage/s3
        if: ${{ matrix.dialect == 'sqlite' }}
        working-directory: storage/s3
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage-${{ matrix.dialect }}.out
          flags: ${{ matrix.dialect }}
          name: coverage-${{ matrix.dialect }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: junit-${{ matrix.dialect }}.xml
          flags: ${{ matrix.dialect }}
          name: junit-${{ matrix.dialect }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload JUnit report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.dialect }}
          path: junit-${{ matrix.dialect }}.xml
