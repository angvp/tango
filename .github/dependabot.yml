version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directories:
      - /
      - /storage/s3
      - /storage/gcs
      - /cache/redis
      - /cache/memcache
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
